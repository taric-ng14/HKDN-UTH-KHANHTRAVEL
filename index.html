<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chọn đề tài – Học kỳ doanh nghiệp tại KhanhTravel</title>
<link rel="icon" href="/logo.png">
<style>
:root{
  --teal:#13B5CE; --teal-d:#0C8FA5; --teal-l:#E3F6FA; --red:#E63329; --red-l:#FDECEA;
  --ink:#12303B; --mut:#5E7782; --line:#D9E6EA; --bg:#F4FAFB; --card:#fff; --ok:#1F9D63; --ok-l:#E4F6EC;
  --r:18px; --shadow:0 18px 50px rgba(18,48,59,.16);
}
@media (prefers-color-scheme:dark){:root{--ink:#E8F3F6;--mut:#9DB4BC;--line:#26424C;--bg:#0C1A1F;--card:#12262D;--teal-l:#10343C;--red-l:#3A1B1A;--ok-l:#0F3123}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;color:inherit}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:calc(10px + env(safe-area-inset-top)) 20px 10px;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header img{height:42px;cursor:pointer;flex:none}
.steps{display:flex;gap:6px;flex:1;justify-content:center}
.steps i{width:34px;height:6px;border-radius:9px;background:var(--line);transition:.3s}
.steps i.on{background:var(--teal)} .steps i.cur{background:var(--red);width:48px}
.live{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut);white-space:nowrap}
.live b{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(31,157,99,.6);animation:pulse 2s infinite}
.live.off b{background:var(--red);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(31,157,99,0)}100%{box-shadow:0 0 0 0 rgba(31,157,99,0)}}
.ghost{white-space:nowrap;background:var(--teal-l);color:var(--teal-d);padding:8px 14px;border-radius:99px;font-weight:600;font-size:13px}
main{min-height:calc(100% - 63px);display:grid;place-items:center;padding:24px 16px 40px;position:relative;overflow:hidden}
main::before,main::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;z-index:0}
main::before{width:420px;height:420px;background:var(--teal);top:-120px;left:-120px}
main::after{width:380px;height:380px;background:var(--red);bottom:-140px;right:-100px;opacity:.2}
.view{position:relative;z-index:1;width:100%;display:grid;place-items:center;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
/* welcome */
.hero{text-align:center;max-width:680px}
.hero .tag{display:inline-block;background:var(--red-l);color:var(--red);font-weight:700;font-size:12.5px;letter-spacing:.08em;padding:6px 14px;border-radius:99px;margin-bottom:18px}
.hero h1{font-size:clamp(30px,6vw,52px);line-height:1.12;font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--teal-d)}
.hero p{color:var(--mut);margin:18px auto 30px;font-size:17px;line-height:1.6;max-width:520px}
.btn{background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#fff;font-weight:700;padding:15px 34px;border-radius:99px;font-size:17px;box-shadow:0 10px 26px rgba(19,181,206,.4);transition:.2s}
.btn:hover{transform:translateY(-2px)} .btn:disabled{opacity:.6;transform:none;cursor:wait}
.btn.red{background:linear-gradient(135deg,#F2504A,var(--red));box-shadow:0 10px 26px rgba(230,51,41,.35)}
.btn.sec{background:var(--teal-l);color:var(--teal-d);box-shadow:none}
.stats{display:flex;gap:12px;justify-content:center;margin-top:34px;flex-wrap:wrap}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 20px;min-width:110px}
.stats b{display:block;font-size:24px;color:var(--teal-d)} .stats span{font-size:12.5px;color:var(--mut)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,30,38,.45);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);border-radius:24px;box-shadow:var(--shadow);width:min(760px,100%);max-height:92vh;overflow:auto;padding:28px;animation:pop .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(16px)}}
.modal.sm{width:min(520px,100%)}
.modal h2{font-size:24px;font-weight:800;letter-spacing:-.01em} .modal .sub{color:var(--mut);margin:6px 0 20px;font-size:15px;line-height:1.5}
.crumb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--teal-l);color:var(--teal-d);font-weight:600;font-size:12.5px;padding:5px 12px;border-radius:99px}
.chip.r{background:var(--red-l);color:var(--red)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
@media(max-width:680px){header{gap:8px;padding-left:12px;padding-right:12px}.ghost{padding:7px 11px;font-size:12px}.grid{grid-template-columns:1fr}.steps i{width:20px}.steps i.cur{width:28px}.live span{display:none}}
.opt{position:relative;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:20px 18px;transition:.2s;display:flex;flex-direction:column;gap:8px}
.opt:hover:not(:disabled){border-color:var(--teal);transform:translateY(-3px);box-shadow:0 12px 28px rgba(19,181,206,.2)}
.opt .big{font-size:40px;font-weight:800;color:var(--teal-d);line-height:1}
.opt .big small{font-size:14px;font-weight:600;color:var(--mut);margin-left:4px}
.opt h3{font-size:16px;line-height:1.35} .opt p{font-size:13px;color:var(--mut);line-height:1.5}
.opt.done{background:var(--ok-l);border-color:transparent}
.opt:disabled{cursor:not-allowed}
.lock{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:700;color:var(--red);background:var(--red-l);padding:5px 10px;border-radius:99px;align-self:flex-start}
.lock.ok{color:var(--ok);background:var(--ok-l)}
.opt.taken{background:repeating-linear-gradient(135deg,var(--card),var(--card) 10px,var(--bg) 10px,var(--bg) 20px);opacity:.85}
.opt.taken h3{color:var(--mut)}
.topic{flex-direction:row;align-items:flex-start;gap:14px;margin-bottom:12px;width:100%}
.topic .n{flex:none;width:38px;height:38px;border-radius:12px;background:var(--teal-l);color:var(--teal-d);font-weight:800;display:grid;place-items:center}
.topic.taken .n{background:var(--red-l);color:var(--red)}
.topic .tx{display:flex;flex-direction:column;gap:8px;flex:1}
.members{font-size:12.5px;color:var(--mut);line-height:1.55;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.members b{color:var(--ink)}
.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.back{background:none;color:var(--mut);font-weight:600;padding:8px 4px}
.box{background:var(--teal-l);border-radius:14px;padding:14px 16px;margin:14px 0;font-size:15px;line-height:1.55}
.warn{font-size:13px;color:var(--red);background:var(--red-l);padding:10px 14px;border-radius:12px;margin-bottom:6px}
.check{width:76px;height:76px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin:0 auto 14px;animation:pop .5s}
.check svg{width:40px;height:40px;stroke:#fff;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.center{text-align:center}
/* board */
.board{display:grid;gap:18px;margin-top:6px}
.room h4{font-size:14px;color:var(--teal-d);margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;font-size:14px}
.row .t{flex:1;line-height:1.4}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--ok));transition:width .5s}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;z-index:50;font-size:14px;max-width:92vw;animation:in .3s}
.demo{background:#FFF4D6;color:#7A5600;text-align:center;font-size:12.5px;padding:6px}
</style>
</head>
<body>
<div id="demo" class="demo" hidden>Chế độ DEMO: chưa kết nối Google Sheet – dữ liệu chỉ lưu tạm trên máy chủ.</div>
<header>
  <img src="/logo.png" alt="KhanhTravel" id="home">
  <div class="steps" id="steps"></div>
  <div class="live" id="live"><b></b><span>Trực tiếp</span></div>
  <button class="ghost" id="boardBtn">Bảng tổng hợp</button>
</header>
<main><div id="app" class="view"></div></main>
<div id="layer"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DATA = null, SEL = [], S = { page: 1, nhom: null, to: null, topic: null, result: null, board: false, confirm: false, busy: false };

const bySlot = (n, t) => SEL.find(s => s.nhom == n && s.to == t);
const byTopic = id => SEL.find(s => s.topicId === id);
const toast = m => { const e = document.createElement('div'); e.className = 'toast'; e.textContent = m; document.body.appendChild(e); setTimeout(() => e.remove(), 3800); };

/* ---------- data ---------- */
async function boot() {
  DATA = await (await fetch('/data.json')).json();
  await refresh(true);
  render();
  setInterval(refresh, 3000);                       // thời gian thực: cập nhật mỗi 3 giây
  document.addEventListener('visibilitychange', () => !document.hidden && refresh());
}
async function refresh(first) {
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    const j = await r.json();
    if (!j.ok) throw 0;
    $('#live').classList.remove('off'); $('#live span').textContent = 'Trực tiếp';
    $('#demo').hidden = !j.demo;
    const changed = JSON.stringify(j.selections) !== JSON.stringify(SEL);
    SEL = j.selections;
    if (changed && !first) onChanged();
  } catch (e) { $('#live').classList.add('off'); $('#live span').textContent = 'Mất kết nối'; }
}
function onChanged() {
  // Đề tài đang xác nhận bị tổ khác lấy mất
  if (S.confirm && byTopic(S.topic)) { S.confirm = false; toast('Rất tiếc, đề tài này vừa được tổ khác chọn.'); }
  if (S.busy) return;
  render();
}

/* ---------- render ---------- */
function steps() {
  const cur = S.board ? 0 : S.page;
  $('#steps').innerHTML = [1, 2, 3, 4].map(i => `<i class="${i < cur ? 'on' : ''} ${i === cur ? 'cur' : ''}"></i>`).join('');
}
function render() {
  steps();
  $('#app').innerHTML = ({ 1: welcome, 2: pickGroup, 3: pickTeam, 4: pickTopic, 5: success })[S.page]();
  $('#layer').innerHTML = (S.board ? boardModal() : '') + (S.confirm ? confirmModal() : '');
}
const go = p => { S.page = p; S.confirm = false; render(); };

function welcome() {
  const done = SEL.length;
  return `<section class="hero">
    <span class="tag">HỌC KỲ DOANH NGHIỆP · ĐỢT 6 · 2026</span>
    <h1>Chào mừng đến <em>Học kỳ doanh nghiệp</em> tại KhanhTravel</h1>
    <p>Mỗi tổ chọn một đề tài chuỗi cung ứng gắn với hoạt động thực tế của công ty. Đề tài đã có tổ chọn sẽ được khóa lại ngay lập tức.</p>
    <button class="btn" onclick="go(2)">Bắt đầu</button>
    <div class="stats"><div><b>3</b><span>Nhóm</span></div><div><b>9</b><span>Tổ</span></div><div><b>${done}/9</b><span>Đã chọn đề tài</span></div></div>
  </section>`;
}

function pickGroup() {
  return `<div class="scrim" style="position:static;background:none;backdrop-filter:none;padding:0"><div class="modal">
    <h2>Chọn nhóm của bạn</h2><p class="sub">Chọn nhóm thực tập mà bạn được phân công.</p>
    <div class="grid">${[1, 2, 3].map(n => {
      const c = SEL.filter(s => s.nhom == n).length;
      return `<button class="opt" onclick="S.nhom=${n};go(3)"><div class="big">${n}<small>Nhóm</small></div><h3>Nhóm ${n}</h3><p>3 tổ · 15 sinh viên</p><span class="lock ${c === 3 ? 'ok' : ''}" style="${c ? '' : 'display:none'}">${c}/3 tổ đã chọn</span></button>`;
    }).join('')}</div>
    <div class="actions"><button class="back" onclick="go(1)">← Quay lại</button></div></div></div>`;
}

function pickTeam() {
  const n = S.nhom;
  return `<div class="scrim" style="position:static;background:none;backdrop-filter:none;padding:0"><div class="modal">
    <div class="crumb"><span class="chip">Nhóm ${n}</span></div>
    <h2>Chọn tổ của bạn</h2><p class="sub">Nhóm ${n} có 3 tổ. Chọn đúng tổ bạn thuộc về.</p>
    <div class="grid">${[1, 2, 3].map(t => {
      const team = DATA.teams[`${n}-${t}`], s = bySlot(n, t);
      return `<button class="opt ${s ? 'done' : ''}" ${s ? 'disabled' : ''} onclick="S.to=${t};go(4)">
        <div class="big">${t}<small>Tổ</small></div>
        ${s ? `<span class="lock ok">✓ Đã chọn ${esc(s.topicId)}</span><p>${esc(s.deTai)}</p>` : `<h3>Tổ ${t}</h3>`}
        <div class="members"><b>Trưởng nhóm:</b> ${esc(team.truong)}<br>${team.members.filter(m => m !== team.truong).map(esc).join(', ')}</div>
      </button>`;
    }).join('')}</div>
    <div class="actions"><button class="back" onclick="go(2)">← Quay lại</button></div></div></div>`;
}

function pickTopic() {
  const { nhom: n, to: t } = S, room = DATA.rooms[t];
  return `<div class="scrim" style="position:static;background:none;backdrop-filter:none;padding:0"><div class="modal">
    <div class="crumb"><span class="chip">Nhóm ${n}</span><span class="chip">Tổ ${t}</span><span class="chip r">Phòng ${esc(room.ten)}</span></div>
    <h2>Chọn đề tài thực tập</h2><p class="sub">Tổ ${t} thực tập tại phòng <b>${esc(room.ten)}</b>. Đề tài đã có tổ chọn sẽ bị khóa.</p>
    ${room.topics.map((tp, i) => {
      const s = byTopic(tp.id);
      return `<button class="opt topic ${s ? 'taken' : ''}" ${s ? 'disabled' : ''} onclick="S.topic='${tp.id}';S.confirm=true;render()">
        <div class="n">${i + 1}</div>
        <div class="tx"><h3>${esc(tp.ten)}</h3>
        ${s ? `<span class="lock">🔒 Đã được chọn bởi Tổ ${s.to} – Nhóm ${s.nhom}</span>` : `<span class="lock ok">Còn trống</span>`}</div></button>`;
    }).join('')}
    <div class="actions"><button class="back" onclick="go(3)">← Quay lại</button></div></div></div>`;
}

function confirmModal() {
  const { nhom: n, to: t } = S, tp = DATA.rooms[t].topics.find(x => x.id === S.topic);
  return `<div class="scrim"><div class="modal sm">
    <h2>Xác nhận chọn đề tài</h2>
    <div class="box"><b>Nhóm ${n} · Tổ ${t}</b> – Phòng ${esc(DATA.rooms[t].ten)}<br><br>${esc(tp.ten)}</div>
    <div class="warn">Sau khi xác nhận, đề tài sẽ bị khóa và không thể thay đổi.</div>
    <div class="actions"><button class="btn sec" ${S.busy ? 'disabled' : ''} onclick="S.confirm=false;render()">Chọn lại</button>
    <button class="btn red" id="okBtn" ${S.busy ? 'disabled' : ''} onclick="submit()">${S.busy ? 'Đang ghi nhận…' : 'Xác nhận'}</button></div>
  </div></div>`;
}

async function submit() {
  S.busy = true; render();
  try {
    const r = await fetch('/api/select', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nhom: S.nhom, to: S.to, topicId: S.topic }) });
    const j = await r.json();
    if (j.selections) SEL = j.selections;
    S.busy = false; S.confirm = false;
    if (j.ok) { S.result = bySlot(S.nhom, S.to); S.page = 5; }
    else { toast(j.error || 'Không thể ghi nhận, thử lại.'); if (j.code === 'TEAM_DONE') S.page = 3; }
  } catch (e) { S.busy = false; toast('Lỗi kết nối, vui lòng thử lại.'); }
  render();
}

function success() {
  const r = S.result || {};
  return `<div class="scrim" style="position:static;background:none;backdrop-filter:none;padding:0"><div class="modal sm center">
    <div class="check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>Đã ghi nhận đề tài!</h2><p class="sub">Kết quả đã được lưu vào hệ thống của KhanhTravel.</p>
    <div class="box" style="text-align:left"><b>Nhóm ${r.nhom} · Tổ ${r.to}</b> – ${esc(r.phong)}<br><br>${esc(r.deTai)}<br><br><small style="color:var(--mut)">Lúc ${esc(r.time)}</small></div>
    <div class="actions" style="justify-content:center"><button class="btn sec" onclick="S.board=true;render()">Xem bảng tổng hợp</button><button class="btn" onclick="S={...S,nhom:null,to:null,topic:null};go(1)">Về trang đầu</button></div>
  </div></div>`;
}

function boardModal() {
  const pct = Math.round(SEL.length / 9 * 100);
  return `<div class="scrim" onclick="if(event.target===this){S.board=false;render()}"><div class="modal">
    <h2>Bảng tổng hợp trực tiếp</h2><p class="sub">${SEL.length}/9 tổ đã chọn đề tài · tự động cập nhật.</p>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="board">${Object.values(DATA.rooms).map(room => `<div class="room"><h4>Phòng ${esc(room.ten)}</h4>${room.topics.map(tp => {
      const s = byTopic(tp.id);
      return `<div class="row"><span class="t"><b>${tp.id}</b> · ${esc(tp.ten)}</span>${s ? `<span class="lock">🔒 Tổ ${s.to} – Nhóm ${s.nhom}</span>` : `<span class="lock ok">Còn trống</span>`}</div>`;
    }).join('')}</div>`).join('')}</div>
    <div class="actions" style="justify-content:flex-end"><button class="btn sec" onclick="S.board=false;render()">Đóng</button></div>
  </div></div>`;
}

$('#boardBtn').onclick = () => { S.board = true; render(); };
$('#home').onclick = () => { if (!S.busy) go(1); };
boot();
</script>
</body>
</html>
